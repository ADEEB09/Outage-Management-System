server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the usual suspects -- JS/CSS bundles compress well, images don't.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy: the frontend code calls relative paths like /api/... and
    # connects its WebSocket to "/" -- nginx forwards both to the backend
    # Service by its internal cluster DNS name. This is what makes it work
    # whether the backend lives at "oms-backend:4000" in Kubernetes, or a
    # different host in Docker Compose -- the browser never needs to know,
    # it only ever talks to this one origin.
    location /api/ {
        proxy_pass http://oms-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs WebSocket upgrade headers specifically -- without
    # these, the connection silently falls back to failing entirely rather
    # than degrading to HTTP polling.
    location /socket.io/ {
        proxy_pass http://oms-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback: try the real file first, then fall back to index.html
    # so React Router handles the route client-side instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
