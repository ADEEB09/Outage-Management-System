apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "oms.backend.labels" . | nindent 4 }}
spec:
  # ClusterIP: only reachable from inside the cluster (e.g. by the frontend,
  # or by Kong once that's added) -- NOT directly exposed to the internet.
  # That's intentional: external traffic should go through the API gateway,
  # not straight to the backend pods.
  type: ClusterIP
  selector:
    {{- include "oms.backend.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
