apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "oms.frontend.labels" . | nindent 4 }}
spec:
  # ClusterIP here too -- real external access should come through an
  # Ingress + Kong (P4.3), not by exposing this Service directly. For a
  # quick local test without an Ingress set up yet, temporarily change
  # this to NodePort or use `kubectl port-forward`.
  type: ClusterIP
  selector:
    {{- include "oms.frontend.labels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
