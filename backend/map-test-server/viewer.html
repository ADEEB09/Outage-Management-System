<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OMS Map Test</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root { --ink: #173355; --muted: #6b7c93; --line: #dde5ee; --live: #0e9f8e; --backlog: #e08a1e; --bg: #f5f7fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; height: 100vh; }
  aside { width: 300px; flex: none; border-right: 1px solid var(--line); background: #fff; display: flex; flex-direction: column; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }
  #status { margin-top: 8px; font-size: 12px; }
  #crews { flex: 1; overflow: auto; }
  .crew { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .crew.sel { background: #eef6f5; box-shadow: inset 3px 0 var(--live); }
  .crew b { display: block; }
  .empty { padding: 16px; color: var(--muted); }
  .legend { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  button { font: inherit; font-size: 12px; margin-top: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  #map { flex: 1; background: #e8eef3; }
  @media (max-width: 700px) { body { flex-direction: column-reverse; } aside { width: 100%; height: 40vh; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <header>
    <h1>OMS map test server</h1>
    <div class="sub">Live crew positions and offline backlog uploads</div>
    <div id="status">Loading…</div>
    <button id="clear" type="button">Clear test data</button>
  </header>
  <div id="crews"></div>
  <div class="legend">
    <div><span class="dot" style="background:var(--live)"></span>Sent live (arrived within 2 min)</div>
    <div><span class="dot" style="background:var(--backlog)"></span>Recorded offline, uploaded later</div>
  </div>
</aside>
<div id="map"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script>
  var map = L.map('map').setView([30.15, 78.1], 10);
  var trailLayer = L.layerGroup().addTo(map);
  var liveLayer = L.layerGroup().addTo(map);
  var selected = null, framed = false;
  var $ = function (id) { return document.getElementById(id); };
  function text(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function ago(ts) {
    var s = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 1000));
    return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' hr ago';
  }

  fetch('/api/tiles/manifest').then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
    if (!m) { $('status').textContent = 'No tile pack yet — run npm run tiles:fetch. Markers still work.'; return; }
    L.tileLayer('/api/tiles/{z}/{x}/{y}.png', { maxNativeZoom: m.maxZoom, maxZoom: 18, attribution: text(m.attribution) }).addTo(map);
    var b = m.bounds; map.fitBounds([[b[1], b[0]], [b[3], b[2]]]);
  });

  function loadTrail() {
    trailLayer.clearLayers();
    if (!selected) return;
    fetch('/api/mobile/crews/' + encodeURIComponent(selected) + '/track').then(function (r) { return r.json(); }).then(function (pts) {
      if (!pts.length) return;
      L.polyline(pts.map(function (p) { return [p.lat, p.lon]; }), { color: '#173355', weight: 3, opacity: 0.6 }).addTo(trailLayer);
      pts.forEach(function (p) {
        var backlog = Date.parse(p.received_at) - Date.parse(p.recorded_at) > 120000;
        L.circleMarker([p.lat, p.lon], { radius: 4, weight: 1, color: '#fff', fillOpacity: 1, fillColor: backlog ? '#e08a1e' : '#0e9f8e' })
          .bindTooltip(text(new Date(p.recorded_at).toLocaleTimeString() + (backlog ? ' (offline, uploaded ' + ago(p.received_at) + ')' : '') +
            (p.accuracy != null ? ' ±' + Math.round(p.accuracy) + 'm' : '')))
          .addTo(trailLayer);
      });
    }).catch(function () {});
  }

  function refresh() {
    fetch('/api/crews/live').then(function (r) { return r.json(); }).then(function (crews) {
      $('status').textContent = crews.length ? 'Updated ' + new Date().toLocaleTimeString() : 'Waiting for the phone to send its first point…';
      if (!selected && crews.length) selected = crews[0].crew_id;
      $('crews').innerHTML = crews.length ? crews.map(function (c) {
        return '<div class="crew' + (c.crew_id === selected ? ' sel' : '') + '" data-id="' + text(c.crew_id) + '"><b>' + text(c.crew_id) + '</b>' +
          '<span class="sub">Last fix ' + ago(c.recorded_at) + ' · ' + c.points + ' points<br>' + c.lat.toFixed(5) + ', ' + c.lon.toFixed(5) + '</span></div>';
      }).join('') : '<div class="empty">No crews yet. Enable tracking in the app.</div>';
      liveLayer.clearLayers();
      crews.forEach(function (c) {
        L.circleMarker([c.lat, c.lon], { radius: 9, color: '#fff', weight: 3, fillColor: '#0e9f8e', fillOpacity: 1 })
          .bindTooltip(text(c.crew_id), { permanent: true, direction: 'top', offset: [0, -8] }).addTo(liveLayer);
      });
      if (!framed && crews.length) { map.setView([crews[0].lat, crews[0].lon], 15); framed = true; }
      loadTrail();
    }).catch(function () { $('status').textContent = 'Server unreachable'; });
  }

  $('crews').addEventListener('click', function (e) {
    var row = e.target.closest('.crew'); if (!row) return;
    selected = row.getAttribute('data-id'); refresh();
  });
  $('clear').addEventListener('click', function () {
    if (!confirm('Delete all test locations?')) return;
    fetch('/api/test-data', { method: 'DELETE' }).then(function () { selected = null; framed = false; refresh(); });
  });
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
